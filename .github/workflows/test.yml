name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # Make sure the registry packaging path works (CPU only in CI).
      - run: ./setup.sh && ./build.sh
      - name: Smoke test the frozen binary
        run: |
          python - <<'PY'
          import openvino as ov, openvino.opset13 as ops
          p = ops.parameter([1, 3, 8, 8], ov.Type.f32, name="images"); r = ops.relu(p)
          ov.save_model(ov.Model([r], [p], "t"), "selftest.xml")
          PY
          if [ -f dist/main.exe ]; then BIN=./dist/main.exe; else BIN=./dist/main; fi
          VIAM_OPENVINO_SELFTEST_MODEL=selftest.xml "$BIN" --selftest
