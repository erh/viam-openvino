# Publishes the module to the Viam registry on version tags.
#
# Linux (amd64, arm64) is built by Viam's cloud build via viamrobotics/build-action, driven by the
# "build" section of meta.json. Windows is built natively here on a windows runner (PyInstaller cannot
# cross-compile from the Linux cloud-build containers) and uploaded with the viam CLI for the same version.
#
# Required repository secrets: viam_key_id, viam_key_value (an org API key with module write access).
on:
  push:
    tags:
      # we support 0.0.1, v0.0.1, 0.0.1-rc1, v0.0.1-rc1
      - "v?[0-9]+.[0-9]+.[0-9]+"
      - "v?[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: viamrobotics/build-action@v1
        with:
          # note: you can replace this line with 'version: ""' if
          # you want to test the build process without deploying
          version: ${{ github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          token: ${{ github.token }} # only required for private git repos

  publish-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build module
        run: ./setup.sh && ./build.sh
      - name: Smoke test the frozen binary
        run: ./dist/main.exe --selftest
      - name: Install viam CLI
        run: |
          curl -sSL -o viam.exe https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-latest-windows-amd64.exe
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Upload windows/amd64
        env:
          VIAM_KEY_ID: ${{ secrets.viam_key_id }}
          VIAM_KEY_VALUE: ${{ secrets.viam_key_value }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          viam.exe login api-key --key-id "$VIAM_KEY_ID" --key "$VIAM_KEY_VALUE"
          # meta.json (rewritten by build.sh to point at dist/main.exe) is read from the working directory.
          viam.exe module upload --version "$VERSION" --platform windows/amd64 --upload dist/archive.tar.gz
